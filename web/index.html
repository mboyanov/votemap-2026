<!doctype html>
<html lang="bg">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Балотаж 2026 по секции</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
    <style>
        :root {
            --surface: #fcfcfb;
            --ink: #1f1f1e;
            --ink-muted: #6b6a65;
            --border: rgba(0, 0, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --surface: #1a1a19;
                --ink: #ececea;
                --ink-muted: #a3a29d;
                --border: rgba(255, 255, 255, 0.14);
            }
        }

        :root[data-theme="dark"] {
            --surface: #1a1a19;
            --ink: #ececea;
            --ink-muted: #a3a29d;
            --border: rgba(255, 255, 255, 0.14);
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--surface);
            font: 13px/1.4 system-ui, sans-serif;
            color: var(--ink);
        }

        #map {
            height: 100%;
        }

        .legend {
            position: absolute;
            left: 12px;
            bottom: 28px;
            width: 300px;
            max-width: calc(100vw - 56px);
            padding: 12px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .legend h1 {
            font-size: 14px;
            margin: 0 0 2px;
        }

        .legend .muted {
            color: var(--ink-muted);
        }

        .legend-section {
            margin-top: 10px;
        }

        .legend-label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .ramp-names,
        .ramp-ticks {
            display: flex;
            justify-content: space-between;
        }

        .ramp-names {
            gap: 8px;
            white-space: nowrap;
        }

        .ramp {
            height: 10px;
            border-radius: 4px;
            margin: 4px 0 2px;
        }

        .ramp-ticks {
            color: var(--ink-muted);
            font-size: 11px;
            font-variant-numeric: tabular-nums;
        }

        .search {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 340px;
            max-width: calc(100vw - 72px);
            /* The suggestion list must open above the legend. */
            z-index: 2;
        }

        .search input {
            box-sizing: border-box;
            width: 100%;
            padding: 9px 12px;
            font: inherit;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .search ul {
            list-style: none;
            margin: 4px 0 0;
            padding: 4px 0;
            max-height: 60vh;
            overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .search li {
            padding: 6px 12px;
            cursor: pointer;
        }

        .search li[aria-selected="true"],
        .search li[role="option"]:hover {
            background: var(--border);
        }

        .search-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-detail,
        .search-empty {
            color: var(--ink-muted);
            font-size: 12px;
        }

        .modes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-top: 6px;
        }

        .modes label {
            cursor: pointer;
        }

        .sizes {
            display: flex;
            align-items: flex-end;
            gap: 14px;
        }

        .sizes figure {
            margin: 0;
            text-align: center;
            color: var(--ink-muted);
            font-size: 11px;
        }

        .sizes span {
            display: block;
            margin: 0 auto 2px;
            border-radius: 50%;
            border: 1px solid var(--ink-muted);
        }

        .swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: -1px;
        }

        .popup {
            color: #1f1f1e;
            min-width: 220px;
        }

        .popup-title {
            font-weight: 600;
        }

        .popup-meta {
            color: #6b6a65;
            margin: 2px 0 6px;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-variant-numeric: tabular-nums;
        }

        .popup-sections-wrap {
            margin-top: 8px;
            max-height: 160px;
            overflow-y: auto;
            border-top: 1px solid rgba(0, 0, 0, 0.12);
        }

        .popup-sections {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        .popup-sections th {
            position: sticky;
            top: 0;
            background: #fff;
            color: #6b6a65;
            font-weight: 600;
            text-align: right;
            padding: 4px 0 2px;
        }

        .popup-sections td {
            text-align: right;
            padding: 1px 0;
        }

        .popup-sections th:first-child,
        .popup-sections td:first-child {
            text-align: left;
            font-family: ui-monospace, monospace;
        }

        @media (max-width: 480px) {
            .legend {
                left: 8px;
                right: 8px;
                bottom: 24px;
                width: auto;
                max-width: none;
            }
        }
    </style>
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" defer></script>
    <script src="search.js" defer></script>
    <script src="results.js" defer></script>
</head>

<body>
    <div id="map"></div>
    <div class="search" role="search">
        <input id="search" type="search" placeholder="Населено място, адрес или № на СИК" autocomplete="off"
            aria-label="Търсене" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
        <ul id="search-results" role="listbox" hidden></ul>
    </div>
    <aside class="legend">
        <h1>Президентски избори 2026 · балотаж</h1>
        <div class="muted" id="totals">Зареждане…</div>

        <div class="legend-section">
            <div class="legend-label">Цвят: дял от гласовете за двамата кандидати</div>
            <div class="ramp-names">
                <span><span class="swatch" id="swatch-red"></span><span id="name-red"></span></span>
                <span><span class="swatch" id="swatch-blue"></span><span id="name-blue"></span></span>
            </div>
            <div id="ramp-scale">
                <div class="ramp" id="ramp"></div>
                <div class="ramp-ticks"><span>90%</span><span>70%</span><span>50/50</span><span>70%</span><span>90%</span></div>
            </div>
            <div class="muted" id="pie-note" hidden>Делът на всеки цвят в кръга е делът на кандидата. Синият дял започва от 12 часа.</div>
            <div class="modes">
                <label><input type="radio" name="color-mode" value="diverging" checked> Скала</label>
                <label><input type="radio" name="color-mode" value="mix"> Смесване (50% = пълен цвят)</label>
                <label><input type="radio" name="color-mode" value="pie"> Кръгови диаграми</label>
            </div>
        </div>

        <div class="legend-section">
            <div class="legend-label">Размер: брой гласували в сградата или групата</div>
            <div class="sizes" id="sizes"></div>
        </div>
    </aside>
</body>

</html>
