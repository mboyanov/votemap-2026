[project]
name = "votemap"
version = "0.1.0"
description = "Map of Bulgarian election results by polling section"
authors = [
    { name = "Martin Boyanov", email = "mboyanov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
votemap-results = "votemap.results:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
